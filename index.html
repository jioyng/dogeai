<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="description" content="사방에서 날아오는 탄을 피해 10개 스테이지와 보스를 돌파하는 닷지 게임">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dodge">
  <meta name="format-detection" content="telephone=no">
  <title>Dodge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="stage">
      <canvas id="game" width="800" height="600"></canvas>
      <button id="pause-btn" class="pause-btn hidden" type="button" aria-label="일시정지">⏸</button>
      <div id="overlay" class="overlay">
        <div id="panel" class="panel"></div>
      </div>
    </div>
  </main>
  <div class="rotate" aria-hidden="true">
    <div class="rotate-icon">📱</div>
    <p>휴대폰을 <b>가로로</b> 돌려 주세요</p>
  </div>
  <script src="stages.js"></script>
  <script src="audio.js"></script>
  <script src="pwa.js"></script>
  <script src="game.js"></script>
</body>
</html>
